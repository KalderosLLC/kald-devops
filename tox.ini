[tox]
envlist = test
requires =
    tox>=4

[testenv:test]
description = Run the unit test suite with coverage. Identical locally and in any CI provider -- `tox -e test` (or just `tox`) is exactly what test.yml and publish.yml run.
extras = test
commands =
    pytest \
        --junitxml={toxinidir}/test-results/junit.xml \
        --cov --cov-report=term-missing \
        --cov-report=xml:{toxinidir}/test-results/coverage.xml \
        --cov-report=html:{toxinidir}/test-results/htmlcov \
        {posargs}

[testenv:build]
description = Build the sdist + wheel via the standard PEP 517 `python -m build` entry point.
skip_install = true
deps = build
commands = python -m build
