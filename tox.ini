[tox]
envlist = test
requires =
    tox>=4

[testenv:test]
description = Run the unit test suite. Identical locally and in any CI provider -- `tox -e test` (or just `tox`) is exactly what test.yml and publish.yml run.
extras = test
commands = pytest {posargs}

[testenv:build]
description = Build the sdist + wheel via the standard PEP 517 `python -m build` entry point.
skip_install = true
deps = build
commands = python -m build
