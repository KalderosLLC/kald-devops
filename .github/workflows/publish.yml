name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tox
        run: pip install tox

      - name: Run tests
        run: tox -e test -- -v

      - name: Write job summary
        if: always()
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/summarize_tests.py test-results/junit.xml >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          tox exec -qq -e test -- coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/junit.xml
          if-no-files-found: warn

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            test-results/coverage.xml
            test-results/htmlcov
          if-no-files-found: warn

      - name: Install build dependencies
        run: pip install build

      - name: Build wheel package
        run: python -m build --wheel

      - name: Create GitHub Release with wheel
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PyPI Simple Index
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p docs/simple/kald-devops
          VERSION=${GITHUB_REF#refs/tags/}
          cat > docs/simple/kald-devops/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Links for kald-devops</title></head>
          <body>
          <h1>Links for kald-devops</h1>
          EOF
          # Add link to the wheel from the release
          echo "<a href=\"https://github.com/KalderosLLC/kald-devops/releases/download/${VERSION}/kald_devops-${VERSION#v}-py3-none-any.whl\">kald_devops-${VERSION#v}-py3-none-any.whl</a>" >> docs/simple/kald-devops/index.html
          echo "</body></html>" >> docs/simple/kald-devops/index.html
          cat docs/simple/kald-devops/index.html

          # Create root-level index for PyPI
          cat > docs/simple/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Simple Index</title></head>
          <body>
          <h1>Simple Index</h1>
          <a href="kald-devops/">kald-devops</a>
          </body></html>
          EOF

      - name: Deploy PyPI Index to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
