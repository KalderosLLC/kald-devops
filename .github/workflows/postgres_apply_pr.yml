name: PostgreSQL Apply PR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      db_host:
        description: 'Database host (optional, uses environment variable if not specified)'
        required: false
        type: string
      db_user:
        description: 'Database user (optional, uses environment variable if not specified)'
        required: false
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kald-devops
        run: pip install -e .

      - name: Apply PostgreSQL PR
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DB_HOST: ${{ inputs.db_host || secrets[format('POSTGRES_{0}_HOST', inputs.environment)] }}
          DB_USER: ${{ inputs.db_user || secrets[format('POSTGRES_{0}_USER', inputs.environment)] }}
          DB_PASSWORD: ${{ secrets[format('POSTGRES_{0}_PASSWORD', inputs.environment)] }}
        run: kald-postgres-util --verbose apply_pr

      - name: Notify Teams
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS_TEXT: 'PostgreSQL apply_pr for ${{ inputs.environment }} - ${{ job.status }}'
        run: |
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            curl -sf -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$STATUS_TEXT" '{"@type":"MessageCard","@context":"http://schema.org/extensions","summary":$text,"title":"PostgreSQL apply_pr","text":$text}')" \
              "$TEAMS_WEBHOOK_URL"
          else
            echo "TEAMS_WEBHOOK_URL not set, skipping Teams notification"
          fi
        continue-on-error: true
