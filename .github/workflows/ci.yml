name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/run-tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: pip install build

      - name: Build wheel package
        run: python -m build --wheel

      - name: Archive wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel built by the build job
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Create GitHub Release with wheel
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PyPI Simple Index
        run: |
          mkdir -p docs/simple/kald-devops
          VERSION=${GITHUB_REF#refs/tags/}
          cat > docs/simple/kald-devops/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Links for kald-devops</title></head>
          <body>
          <h1>Links for kald-devops</h1>
          EOF
          # Add link to the wheel from the release
          echo "<a href=\"https://github.com/KalderosLLC/kald-devops/releases/download/${VERSION}/kald_devops-${VERSION#v}-py3-none-any.whl\">kald_devops-${VERSION#v}-py3-none-any.whl</a>" >> docs/simple/kald-devops/index.html
          echo "</body></html>" >> docs/simple/kald-devops/index.html
          cat docs/simple/kald-devops/index.html

          # Create root-level index for PyPI
          cat > docs/simple/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Simple Index</title></head>
          <body>
          <h1>Simple Index</h1>
          <a href="kald-devops/">kald-devops</a>
          </body></html>
          EOF

      - name: Deploy PyPI Index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
