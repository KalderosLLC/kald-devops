name: Apply Terraform

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'Comma-delimited target environments (e.g., Stage,Prod)'
        required: true
        type: string
      pr:
        description: 'Pull request number (defaults to last merged PR on main)'
        required: false
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    container: ghcr.io/kalderosllc/kald-devops/devops-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kald-devops
        run: pip install -e .

      - name: Apply Terraform
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ secrets.PHOENIX_PAT }}
        run: kald-devops --verbose apply_terraform
