name: Apply Flyway

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'Comma-delimited target environments (e.g., Stage,Prod)'
        required: true
        type: string
      branch_or_tag:
        description: 'Semver tag (e.g., v1.21.0) or branch name (default: main)'
        required: false
        default: 'main'
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    container: ghcr.io/kalderosllc/kald-devops/devops-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kald-devops
        run: pip install -e .

      - name: Apply Flyway
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          BRANCH_OR_TAG: ${{ inputs.branch_or_tag }}
          GITHUB_TOKEN: ${{ secrets.PHOENIX_PAT }}
        run: kald-devops --verbose apply_flyway