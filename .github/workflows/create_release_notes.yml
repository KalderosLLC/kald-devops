name: Create Release Notes

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository path (e.g., KalderosLLC/phoenix)'
        required: true
        type: string
      tag:
        description: 'Tag name to create release notes for'
        required: true
        type: string

jobs:
  create_release:
    runs-on: ubuntu-latest
    container: ghcr.io/kalderosllc/kald-devops/devops-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kald-devops
        run: pip install -e .

      - name: Create Release Notes
        env:
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: kald-devops --verbose create_release_notes
